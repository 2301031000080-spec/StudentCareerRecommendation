<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Assessment | CareerGuide AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <nav>
        <div class="logo">CareerGuide AI</div>
        <div><a href="/">Home</a></div>
    </nav>
</header>

<section class="assessment-page">
    <div class="assessment">
        <div class="hero-tag">AI CAREER ASSESSMENT</div>

        <h1>
            Let's find your<br>
            <span>career match.</span>
        </h1>

        <p>
            Answer a few simple questions about yourself.
            Our AI-based recommendation system will analyze
            your profile and suggest a suitable career path.
        </p>

        <form method="POST" action="/assessment">
            <label for="name">What's your name?</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="interest">What area interests you the most?</label>
            <select id="interest" name="interest" required>
                <option value="">Select your interest</option>

                <optgroup label="Technology & IT">
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                    <option value="Machine Learning">Machine Learning</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="App Development">App Development</option>
                </optgroup>

                <optgroup label="Commerce & Finance">
                    <option value="Commerce & Finance">Commerce & Finance</option>
                </optgroup>

                <optgroup label="Medical & Healthcare">
                    <option value="Medical & Healthcare">Medical & Healthcare</option>
                </optgroup>

                <optgroup label="Law & Public Services">
                    <option value="Law & Public Services">Law & Public Services</option>
                </optgroup>

                <optgroup label="Management & Business">
                    <option value="Management & Business">Management & Business</option>
                </optgroup>

                <optgroup label="Science & Research">
                    <option value="Science & Research">Science & Research</option>
                </optgroup>

                <optgroup label="Engineering & Technology">
                    <option value="Engineering & Technology">Engineering & Technology</option>
                </optgroup>

                <optgroup label="Education">
                    <option value="Education">Education</option>
                </optgroup>
            </select>

            <label for="academic_performance">How would you describe your academic performance?</label>
            <select id="academic_performance" name="academic_performance" required>
                <option value="">Select your performance</option>
                <option value="Average">Average</option>
                <option value="Good">Good</option>
                <option value="High">High</option>
            </select>

            <label for="programming">How would you rate your programming skills?</label>
            <select id="programming" name="programming" required>
                <option value="">Select your level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <label for="problem_solving">How would you rate your problem-solving ability?</label>
            <select id="problem_solving" name="problem_solving" required>
                <option value="">Select your level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Good</option>
                <option value="Advanced">Excellent</option>
            </select>

            <label for="communication">How would you rate your communication skills?</label>
            <select id="communication" name="communication" required>
                <option value="">Select your level</option>
                <option value="Beginner">Needs improvement</option>
                <option value="Intermediate">Good</option>
                <option value="Advanced">Excellent</option>
            </select>

            <label for="goal">What is your main career goal?</label>
            <select id="goal" name="goal" required>
                <option value="">Select your goal</option>
            </select>

            <button type="submit">Analyze My Profile ✨</button>
        </form>
    </div>
</section>

<footer>
    <p>CareerGuide AI • Student Career Recommendation System</p>
</footer>

<script>
    // Career goals are tailored to the selected professional field.
    // The option values remain compatible with the ML dataset while the
    // visible text is specific to the student's chosen field.
    const goalOptions = {
        "Artificial Intelligence": [
            ["Technical career", "AI & Technology"],
            ["High salary", "High-paying AI career"],
            ["Research", "AI Research & Innovation"]
        ],
        "Machine Learning": [
            ["Technical career", "Machine Learning & Technology"],
            ["High salary", "High-paying ML career"],
            ["Research", "ML Research & Innovation"]
        ],
        "Data Science": [
            ["Technical career", "Data & Analytics"],
            ["High salary", "High-paying data career"],
            ["Research", "Data Research & Innovation"]
        ],
        "Web Development": [
            ["Technical career", "Web & Software Development"],
            ["Creative work", "Creative Web Development"],
            ["High salary", "High-paying development career"]
        ],
        "Cyber Security": [
            ["Technical career", "Cybersecurity & Protection"],
            ["High salary", "High-paying cybersecurity career"],
            ["Research", "Security Research & Innovation"]
        ],
        "App Development": [
            ["Technical career", "Mobile App Development"],
            ["Creative work", "Creative App Development"],
            ["High salary", "High-paying app development career"]
        ],
        "Commerce & Finance": [
            ["High salary", "Finance & Investment"],
            ["Stable career", "Banking & Accounting"],
            ["Technical career", "Business & Financial Analysis"],
            ["Creative work", "Marketing & Business"],
            ["High salary", "Corporate & Business Career"]
        ],
        "Medical & Healthcare": [
            ["Stable career", "Healthcare & Patient Care"],
            ["Stable career", "Medical Profession"],
            ["Research", "Medical Research & Science"],
            ["High salary", "Specialized Healthcare Career"]
        ],
        "Law & Public Services": [
            ["Stable career", "Law & Legal Practice"],
            ["Stable career", "Government & Public Service"],
            ["Research", "Public Policy & Research"],
            ["High salary", "Legal & Professional Career"]
        ],
        "Management & Business": [
            ["High salary", "Business Management"],
            ["Creative work", "Marketing & Sales"],
            ["Stable career", "Human Resources & Administration"],
            ["Technical career", "Operations & Project Management"],
            ["High salary", "Entrepreneurship & Business"]
        ],
        "Science & Research": [
            ["Research", "Scientific Research & Innovation"],
            ["Stable career", "Science & Laboratory Career"],
            ["Technical career", "Applied Science & Technology"]
        ],
        "Engineering & Technology": [
            ["Technical career", "Engineering & Technology"],
            ["High salary", "High-paying Engineering Career"],
            ["Research", "Engineering Research & Innovation"],
            ["Stable career", "Core Engineering Career"]
        ],
        "Education": [
            ["Stable career", "Teaching & Education"],
            ["Research", "Academic Research"],
            ["Creative work", "Educational Development"],
            ["High salary", "Professional Education Career"]
        ]
    };

    const interestSelect = document.getElementById("interest");
    const goalSelect = document.getElementById("goal");

    function updateCareerGoals() {
        const interest = interestSelect.value;
        const options = goalOptions[interest] || [];

        goalSelect.innerHTML = '<option value="">Select your goal</option>';

        options.forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            goalSelect.appendChild(option);
        });
    }

    interestSelect.addEventListener("change", updateCareerGoals);
</script>
</body>
</html>
